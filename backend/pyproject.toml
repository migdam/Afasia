# Tool configuration for the backend. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
# A parametrized test whose list comes out empty must fail, not quietly skip.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# For now only the checks that catch real breakage: syntax errors and
# undefined names. Backlog P3-3 widens this to the default rule set.
select = ["E9", "F63", "F7", "F82"]
