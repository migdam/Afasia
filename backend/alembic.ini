# Alembic: the database's schema changes, as migrations (backlog P3-1).
# The app applies them when it starts (app/db/database.py, migrate), with
# its own DATABASE_URL. To add one after changing app/db/models.py, from the
# backend directory:
#     alembic revision --autogenerate -m "what changed"
# then read and correct the generated file in migrations/versions/.
[alembic]
script_location = %(here)s/migrations
# So the command line finds the app package.
prepend_sys_path = %(here)s
path_separator = os
