server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Pages, scripts and styles have no version in their names, so browsers
    # must check with the server before reusing a copy (no-cache), or people
    # would keep running old code. nginx answers "not modified" cheaply.
    # (add_header in a location replaces the server-level headers, hence
    # the include in each one.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # The API, on the same origin (^~ so the static-asset rule below can't
    # take these requests)
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, don't append to, what the client sent: the backend trusts
        # this header for the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Images and fonts change rarely: a day is enough.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    include /etc/nginx/conf.d/security-headers.inc;
}
