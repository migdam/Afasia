# The whole app: nginx serves the frontend on FRONTEND_PORT and proxies /api
# to the backend, which keeps its data in PostgreSQL. Secrets come from .env
# at the repository root (copy .env.template); `docker compose up` refuses to
# start without them. scripts/docker-smoke.sh checks the stack end to end.

services:
  backend:
    build:
      context: ./backend
      secrets:
        - pip_ca
    # Only reachable from this machine: the backend trusts X-Forwarded-For
    # (below), so nothing but nginx and local tools may talk to it directly.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # Take the client address from nginx's X-Forwarded-For (read by
      # uvicorn), so wrong passwords are counted per client.
      FORWARDED_ALLOW_IPS: "*"
      # Only what is listed here reaches the backend, so every setting is
      # listed, taken from .env, with the app's own default (checked by
      # backend/tests/test_docker_settings.py). DATABASE_URL, UPLOAD_DIR,
      # HOST and PORT are fixed by this setup.
      DATABASE_URL: postgresql://aphasia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aphasia_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-false}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LOGIN_MAX_HOURS: ${LOGIN_MAX_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_MAX_FAILURES_PER_ACCOUNT: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:-50}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-0}
      LEVEL_WINDOW: ${LEVEL_WINDOW:-3}
      LEVEL_UP_SCORE: ${LEVEL_UP_SCORE:-85.0}
      LEVEL_DOWN_SCORE: ${LEVEL_DOWN_SCORE:-50.0}
      STREAK_REST_DAYS: ${STREAK_REST_DAYS:-2}
      # nginx also caps uploads at 10 MB (client_max_body_size).
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aphasia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aphasia_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aphasia", "-d", "aphasia_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:

secrets:
  # An extra CA bundle for pip, only needed behind a TLS-inspecting proxy.
  pip_ca:
    file: ${PIP_CA_FILE:-/dev/null}
