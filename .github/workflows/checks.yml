# The checks, on every push and pull request (backlog P3-2): scripts/check.sh,
# the same one that must pass before every commit (lint, known
# vulnerabilities, backend tests, the README quick start, browser tests),
# and the Docker Compose stack's smoke test.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to the commits of their release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: System libraries for the test browser
        run: |
          python -m pip install --quiet "playwright==$(grep -oP '^playwright==\K.*' backend/requirements-dev.txt)"
          sudo "$(command -v python)" -m playwright install-deps chromium
      - name: Lint, vulnerabilities, tests, quick start and browser tests
        env:
          PYTHON: python
        # On failure, the end of the output also becomes an annotation, which
        # shows on the run's page and can be read through the API.
        run: |
          set -o pipefail
          scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log" || {
            status=$?
            tail -n 80 "$RUNNER_TEMP/check.log" | python -c 'import sys; print("::error title=scripts/check.sh failed::" + sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit "$status"
          }

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the stack, start it and check it through nginx
        run: scripts/docker-smoke.sh
